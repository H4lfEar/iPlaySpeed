<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>검극 — 패링의 길</title>
<style>
  html,body{margin:0;padding:0;background:#07080c;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{max-width:98vw;max-height:96vh;aspect-ratio:16/9;outline:none;cursor:crosshair;
         box-shadow:0 0 60px rgba(120,30,30,.25);border:1px solid #2a1d1d;border-radius:4px}
</style>
</head>
<body>
<canvas id="g" width="960" height="540"></canvas>
<script>
'use strict';
const cv = document.getElementById('g');
const ctx = cv.getContext('2d');
const W = 960, H = 540, GY = 448;          // ground Y
const PX = 340, EX = 632;                  // player / enemy world X

const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rand  = (a,b)=>a+Math.random()*(b-a);
const pick  = arr=>arr[Math.floor(Math.random()*arr.length)];

// ---------------------------------------------------------------- audio
let AC = null;
function ensureAudio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume();
}
function playTone(f, dur, type, vol, f2){
  if(!AC) return;
  const t0 = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t0+dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
function playNoise(dur, vol, freq, q, type){
  if(!AC) return;
  const t0 = AC.currentTime;
  const len = Math.floor(AC.sampleRate*dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type||'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start(t0);
}
const sClang  = ()=>{ playNoise(.18,.5,5200,1.2,'highpass'); playTone(1900,.16,'square',.10,700); playTone(2850,.09,'sine',.10); };
const sBlock  = ()=>{ playNoise(.12,.35,900,1); playTone(300,.12,'square',.10,160); };
const sHit    = ()=>{ playTone(110,.25,'sine',.40,55); playNoise(.15,.3,500,.8,'lowpass'); };
const sWhoosh = ()=>{ playNoise(.22,.22,1200,.7); };
const sSwish  = ()=>{ playNoise(.10,.12,2500,.9,'highpass'); };
const sCue    = ()=>{ playNoise(.25,.12,750,1); };
const sGlint  = ()=>{ playTone(2300,.07,'sine',.08); };
const sDanger = ()=>{ playTone(1180,.09,'square',.16); setTimeout(()=>playTone(1180,.09,'square',.16), 95); };
const sMikiri = ()=>{ playTone(150,.18,'sine',.35,80); playNoise(.14,.4,3800,1,'highpass'); };
const sBreak  = ()=>{ playTone(70,.5,'sine',.5,40); playNoise(.4,.4,300,.7,'lowpass'); };
const sKill   = ()=>{ playTone(80,.45,'sine',.5,40); playTone(2400,.4,'sine',.18,1100); playNoise(.3,.45,4500,1,'highpass'); };

// ---------------------------------------------------------------- phase data
const PHASES = [
  {name:'제1막', postMax:100, spd:1.00, combos:[
    ['slash'],['slash'],['slash','slash'],['thrust'],['slash','thrust'],['slash','slash']]},
  {name:'제2막', postMax:115, spd:0.82, combos:[
    ['slash','slash'],['thrust'],['sweep'],['slash','sweep'],['slash','slash','thrust'],['thrust','slash']]},
  {name:'제3막', postMax:130, spd:0.68, combos:[
    ['slash','slash','slash'],['sweep','thrust'],['slash','thrust','slash'],['sweep'],
    ['slash','slash','sweep','thrust'],['thrust','thrust']]},
];
const BASE_WINDUP = {slash:950, thrust:1150, sweep:1100};
const DMG         = {slash:12,  thrust:18,   sweep:16};
const PERILOUS    = {thrust:true, sweep:true};

// timing windows (ms relative to impact)
const WIN = { perfEarly:110, perfLate:55, blockEarly:280, blockLate:55,
              mikiriEarly:250, mikiriLate:60, jumpEarly:300, jumpLate:70 };

// ---------------------------------------------------------------- game state
let state = 'title';          // title | fight | defeat | victory
let stateT = 0;
let T = 0;                    // game-time ms (slow-mo affected)
let timeScale = 1, slowUntilReal = 0;
let realPrev = performance.now();
let shake = 0;
let flash = {color:null, a:0};
let pending = null;           // {at, type, impactT}
let player, enemy, stats, phase;
let floats = [], sparks = [], petals = [];
let interMsg = null;          // {txt, sub, until}

const keysDown = new Set();
const pressT = {parry:-1e9, mikiri:-1e9, jump:-1e9};
let lastParryRaw = -1e9;

function resetGame(){
  phase = 0;
  player = {hp:100, post:0, stunUntil:-1e9, parryT:-1e9, mikiriT:-1e9, jumpT:-1e9, hitT:-1e9};
  enemy  = {post:0, postMax:PHASES[0].postMax, state:'cooldown', t:1500, atk:null,
            combo:null, idx:0, lastGain:-1e9, brokenUntil:0, glintPlayed:false, hitReact:-1e9};
  stats  = {perfects:0, blocks:0, hitsTaken:0, mikiris:0, streak:0, maxStreak:0, start:T};
  pending = null; floats = []; sparks = [];
  interMsg = {txt:PHASES[0].name, sub:'공격을 튕겨내라', until:T+1600};
  state = 'fight'; stateT = T;
}

// ---------------------------------------------------------------- input
addEventListener('keydown', e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  keysDown.add(e.code);
  ensureAudio();
  onKey(e.code);
});
addEventListener('keyup', e=>keysDown.delete(e.code));
cv.addEventListener('pointerdown', ()=>{ ensureAudio(); onKey('Space'); });

function onKey(code){
  if(state==='title'){ if(code==='Space') resetGame(); return; }
  if(state==='defeat' || state==='victory'){
    if(code==='KeyR' || (code==='Space' && T-stateT>800)) resetGame();
    return;
  }
  // fight
  if(code==='Space'){
    if(enemy.state==='broken'){ executeDeathblow(); return; }
    doParry();
  }else if(code==='ArrowDown' || code==='KeyS'){ doMikiri(); }
  else if(code==='ArrowUp'   || code==='KeyW'){ doJump(); }
}
function doParry(){
  if(player.stunUntil>T) return;
  if(T-lastParryRaw < 160) return;        // anti-spam cooldown
  lastParryRaw = T;
  pressT.parry = T; player.parryT = T;
  sSwish();
}
function doMikiri(){
  if(player.stunUntil>T) return;
  pressT.mikiri = T; player.mikiriT = T;
}
function doJump(){
  if(player.stunUntil>T) return;
  pressT.jump = T;
  if(T-player.jumpT > 440){ player.jumpT = T; sWhoosh(); }
}

// ---------------------------------------------------------------- enemy AI
function startCombo(){
  const ph = PHASES[phase];
  enemy.combo = pick(ph.combos);
  enemy.idx = 0;
  startWindup();
}
function startWindup(){
  const ph = PHASES[phase];
  const type = enemy.combo[enemy.idx];
  const follow = enemy.idx>0 ? 0.62 : 1;
  enemy.atk = {type, windup: BASE_WINDUP[type]*ph.spd*follow*rand(0.92,1.08)};
  enemy.state = 'windup'; enemy.t = 0; enemy.glintPlayed = false;
  if(PERILOUS[type]){ sDanger(); } else { sCue(); }
}
function impact(){
  pending = {at:T+60, type:enemy.atk.type, impactT:T};
  enemy.state = 'strike'; enemy.t = 0;
  sWhoosh();
}
function nextInCombo(){
  enemy.idx++;
  if(enemy.combo && enemy.idx < enemy.combo.length){ startWindup(); }
  else { enemy.state = 'recover'; enemy.t = 0; }
}

// ---------------------------------------------------------------- resolution
const within = (v,a,b)=>v>=a && v<=b;

function resolve(){
  const a = pending; pending = null;
  const t = a.impactT;
  if(player.stunUntil>T){ playerHit(a.type, 1.25); consume(); return; }
  if(a.type==='slash'){
    if(within(pressT.parry, t-WIN.perfEarly, t+WIN.perfLate)) perfectDeflect(1);
    else if(within(pressT.parry, t-WIN.blockEarly, t+WIN.blockLate) || keysDown.has('Space')) blockHit(a.type, 1);
    else playerHit(a.type, 1);
  }else if(a.type==='thrust'){
    if(within(pressT.mikiri, t-WIN.mikiriEarly, t+WIN.mikiriLate)) mikiriCounter();
    else if(within(pressT.parry, t-WIN.perfEarly, t+WIN.perfLate)) perfectDeflect(0.6);
    else if(within(pressT.parry, t-WIN.blockEarly, t+WIN.blockLate) || keysDown.has('Space')) blockHit(a.type, 1.6);
    else playerHit(a.type, 1);
  }else{ // sweep — must jump, blocking is useless
    if(within(pressT.jump, t-WIN.jumpEarly, t+WIN.jumpLate)) jumpEvade();
    else playerHit(a.type, 1);
  }
  consume();
}
function consume(){ pressT.parry = pressT.mikiri = pressT.jump = -1e9; }

const clashX = ()=> (PX+EX)/2, clashY = ()=> GY-92;

function perfectDeflect(mul){
  gainEnemyPost((14 + phase*2)*mul);
  stats.perfects++; stats.streak++;
  stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
  spawnSparks(clashX(), clashY(), 26, '#ffd277', 7);
  spawnSparks(clashX(), clashY(), 10, '#fff6e0', 9);
  shake = Math.min(shake+9, 14);
  slowmo(0.25, 110);
  flash = {color:'#fff2cc', a:0.18};
  sClang();
  floatText(clashX(), clashY()-30, '튕겨냄!', '#ffd277', 24);
  enemy.hitReact = T;
}
function mikiriCounter(){
  gainEnemyPost(26);
  stats.mikiris++; stats.streak++;
  stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
  spawnSparks(EX-40, GY-60, 30, '#7fe0ff', 8);
  shake = Math.min(shake+11, 16);
  slowmo(0.22, 140);
  flash = {color:'#bfeaff', a:0.2};
  sMikiri();
  floatText(EX-50, GY-150, '미키리 카운터!', '#7fe0ff', 26);
  enemy.hitReact = T;
}
function jumpEvade(){
  gainEnemyPost(8);
  spawnSparks(PX, GY-130, 8, '#cfd8e6', 4);
  floatText(PX, GY-190, '회피!', '#cfd8e6', 20);
}
function blockHit(type, mul){
  stats.blocks++; stats.streak = 0;
  player.post = clamp(player.post + 9*mul, 0, 100);
  spawnSparks(clashX()-20, clashY(), 8, '#9aa3b0', 4);
  shake = Math.min(shake+4, 8);
  sBlock();
  floatText(clashX()-10, clashY()-20, '막음', '#9aa3b0', 18);
  if(player.post>=100) staggerPlayer();
}
function playerHit(type, mul){
  const dmg = Math.round(DMG[type]*mul);
  player.hp = clamp(player.hp - dmg, 0, 100);
  player.post = clamp(player.post + 16, 0, 100);
  player.hitT = T; stats.hitsTaken++; stats.streak = 0;
  spawnSparks(PX+18, GY-80, 14, '#ff5a48', 6);
  shake = Math.min(shake+10, 15);
  flash = {color:'#a01818', a:0.3};
  sHit();
  floatText(PX, GY-160, '-'+dmg, '#ff6a55', 24);
  if(player.hp<=0){
    state = 'defeat'; stateT = T; pending = null;
    slowmo(0.3, 600);
    return;
  }
  if(player.post>=100) staggerPlayer();
}
function staggerPlayer(){
  player.stunUntil = T+900;
  player.post = 50;
  floatText(PX, GY-190, '자세 붕괴!', '#ffae42', 24);
  sBreak();
}
function gainEnemyPost(v){
  enemy.post += v;
  enemy.lastGain = T;
  if(enemy.post >= enemy.postMax && enemy.state!=='broken'){
    enemy.post = enemy.postMax;
    enemy.state = 'broken';
    enemy.brokenUntil = T+2600;
    pending = null;
    sBreak();
    slowmo(0.35, 350);
    floatText(EX, GY-200, '체간 붕괴!', '#ff4536', 30);
  }
}
function executeDeathblow(){
  phase++;
  spawnSparks(EX, GY-90, 50, '#ff4536', 10);
  spawnSparks(EX, GY-90, 20, '#fff', 12);
  shake = 18;
  flash = {color:'#7d0f0f', a:0.55};
  sKill();
  slowmo(0.2, 250);
  if(phase >= PHASES.length){
    state = 'victory'; stateT = T;
    return;
  }
  const ph = PHASES[phase];
  enemy.post = 0; enemy.postMax = ph.postMax;
  enemy.state = 'cooldown'; enemy.t = 2200; enemy.combo = null;
  player.hp = clamp(player.hp+35, 0, 100);
  player.post = 0;
  interMsg = {txt:ph.name, sub:'더 빠르고, 더 사납게', until:T+1800};
  floatText(EX, GY-170, '인살!', '#ff4536', 34);
}

// ---------------------------------------------------------------- update
function slowmo(scale, durReal){
  timeScale = scale;
  slowUntilReal = performance.now()+durReal;
}
function update(dt){
  // ambient petals
  if(petals.length<24 && Math.random()<0.03)
    petals.push({x:rand(-50,W), y:-10, vx:rand(8,24), vy:rand(18,40), r:rand(2,4), w:rand(0,6.28)});
  for(const p of petals){ p.x+=p.vx*dt/1000; p.y+=p.vy*dt/1000; p.w+=dt/400; }
  petals = petals.filter(p=>p.y<H+20 && p.x<W+60);

  for(const s of sparks){
    s.x+=s.vx*dt/16; s.y+=s.vy*dt/16; s.vy+=0.12*dt/16; s.t+=dt;
  }
  sparks = sparks.filter(s=>s.t<s.life);
  floats = floats.filter(f=>T-f.t0<f.life);
  shake *= Math.pow(0.9, dt/16);
  if(flash.a>0) flash.a = Math.max(0, flash.a - dt/350);

  if(state!=='fight') return;

  if(pending && T>=pending.at) resolve();

  // posture decay
  if(T-enemy.lastGain>1400 && enemy.state!=='broken')
    enemy.post = Math.max(0, enemy.post - dt*0.006);
  player.post = Math.max(0, player.post - dt*0.010);

  // enemy state machine
  const e = enemy;
  if(e.state==='cooldown'){
    e.t -= dt;
    if(e.t<=0 && (!interMsg || T>interMsg.until)) startCombo();
  }else if(e.state==='windup'){
    e.t += dt;
    const p = e.t/e.atk.windup;
    if(!e.glintPlayed && p>0.78){ e.glintPlayed = true; sGlint(); }
    if(e.t>=e.atk.windup) impact();
  }else if(e.state==='strike'){
    e.t += dt;
    if(e.t>=220) nextInCombo();
  }else if(e.state==='recover'){
    e.t += dt;
    if(e.t>=420){ e.state='cooldown'; e.t = rand(1000,1800)*PHASES[phase].spd; }
  }else if(e.state==='broken'){
    if(T>=e.brokenUntil){
      e.post = e.postMax*0.5;
      e.state = 'cooldown'; e.t = 900;
      floatText(EX, GY-180, '기회를 놓쳤다…', '#8a93a3', 20);
    }
  }
}

// ---------------------------------------------------------------- fx helpers
function spawnSparks(x,y,n,color,speed){
  for(let i=0;i<n;i++){
    const a = rand(0,Math.PI*2), v = rand(speed*0.3, speed);
    sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,t:0,life:rand(200,500),color,size:rand(1.5,3.5)});
  }
}
function floatText(x,y,txt,color,size){
  floats.push({x,y,txt,color,size,t0:T,life:900});
}

// ---------------------------------------------------------------- poses
function playerPose(){
  const p = player;
  const pose = {adv:0, yOff:0, lean:0, crouch:0,
                swordA:-0.55+Math.sin(T/420)*0.04, glow:false, glowColor:'#cfe6ff',
                body:'#d7dee9', sword:'#eef3fa'};
  const tj = T-p.jumpT;
  if(tj<440) pose.yOff = 100*Math.sin(Math.PI*clamp(tj/440,0,1));
  const tp = T-p.parryT;
  if(tp<160){
    const k = Math.sin(Math.PI*tp/160);
    pose.swordA = -0.55-0.95*k; pose.lean = 0.12*k; pose.glow = true;
  }
  const tm = T-p.mikiriT;
  if(tm<220){
    const k = Math.sin(Math.PI*tm/220);
    pose.adv = 26*k; pose.crouch = 0.5*k; pose.swordA = -0.15;
  }
  const th = T-p.hitT;
  if(th<240){ pose.lean = -0.35*(1-th/240); }
  if(p.stunUntil>T){ pose.lean = -0.5+Math.sin(T/30)*0.06; pose.swordA = 0.7; }
  if(state==='defeat'){ pose.crouch = 1; pose.lean = -1.1; pose.swordA = 0.9; }
  return pose;
}
function enemyPose(){
  const e = enemy;
  const pose = {adv:0, yOff:0, lean:0, crouch:0,
                swordA:-0.5+Math.sin(T/380)*0.04, glow:false, glowColor:'#fff',
                body:'#b3554e', sword:'#f0e6d6'};
  const type = e.atk ? e.atk.type : null;
  if(state==='victory'){ pose.crouch = 1; pose.lean = -1.2; pose.swordA = 1.2; return pose; }
  if(e.state==='windup'){
    const p = clamp(e.t/e.atk.windup, 0, 1), q = Math.pow(p, 1.4);
    if(type==='slash'){ pose.swordA = -0.5-1.9*q; pose.lean = -0.25*q; }
    else if(type==='thrust'){ pose.swordA = -0.1; pose.adv = -20*q; pose.lean = -0.3*q; }
    else { pose.swordA = -0.5-2.1*q; pose.crouch = q; pose.lean = -0.2*q; }
    if(PERILOUS[type]){ pose.glow = true; pose.glowColor = '#ff4536'; }
    else if(p>0.75){ pose.glow = true; pose.glowColor = '#ffffff'; }
  }else if(e.state==='strike'){
    const p = clamp(e.t/180, 0, 1);
    if(type==='slash'){ pose.swordA = -2.4+3.0*p; pose.lean = 0.3*p; }
    else if(type==='thrust'){ pose.adv = -20+72*p; pose.swordA = 0; pose.lean = 0.25; }
    else { pose.swordA = -2.6+3.2*p; pose.crouch = 1; pose.lean = 0.25*p; }
  }else if(e.state==='recover'){
    const p = 1-clamp(e.t/420, 0, 1);
    pose.lean = 0.15*p;
  }else if(e.state==='broken'){
    pose.lean = 0.55+Math.sin(T/60)*0.05; pose.swordA = 1.0; pose.crouch = 0.4;
  }
  const tr = T-e.hitReact;
  if(tr<180){ pose.lean += 0.3*(1-tr/180); pose.adv += 10*(1-tr/180); }
  return pose;
}

// ---------------------------------------------------------------- drawing
function line0(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }

function drawFighter(x, facing, pose){
  ctx.save();
  ctx.translate(x + pose.adv*facing, GY - pose.yOff);
  ctx.scale(facing, 1);
  ctx.lineCap = 'round';
  ctx.strokeStyle = pose.body;
  ctx.lineWidth = 5;
  const crouch = pose.crouch||0;
  const hipY = -46 + crouch*14;
  // legs
  line0(0, hipY, -15, 0);
  line0(0, hipY, 17, -crouch*4);
  // upper body rotated around hip
  ctx.save();
  ctx.translate(0, hipY);
  ctx.rotate(pose.lean||0);
  const shX = 2, shY = -34 + crouch*6;
  line0(0, 0, shX, shY);                        // torso
  ctx.fillStyle = pose.body;
  ctx.beginPath(); ctx.arc(shX, shY-15, 10, 0, Math.PI*2); ctx.fill();   // head
  // headband tail
  ctx.lineWidth = 2.5;
  line0(shX-8, shY-18, shX-22-Math.sin(T/200)*3, shY-14);
  ctx.lineWidth = 5;
  const gripX = shX+16, gripY = shY+9;
  line0(shX, shY, gripX, gripY);                // arm
  // sword
  ctx.save();
  ctx.translate(gripX, gripY);
  ctx.rotate(pose.swordA);
  if(pose.glow){ ctx.shadowColor = pose.glowColor; ctx.shadowBlur = 16; }
  ctx.strokeStyle = pose.sword;
  ctx.lineWidth = 3.5;
  line0(0, 0, 66, 0);
  ctx.lineWidth = 5; line0(-2, 0, 8, 0);        // hilt
  ctx.restore();
  ctx.restore();
  ctx.restore();
}

function drawStrikeTrail(){
  const e = enemy;
  if(e.state!=='strike' || !e.atk) return;
  const p = clamp(e.t/180, 0, 1);
  const type = e.atk.type;
  ctx.save();
  ctx.translate(EX, GY-80);
  ctx.globalAlpha = 0.5*(1-p);
  ctx.strokeStyle = PERILOUS[type] ? '#ff7a64' : '#e8eef7';
  ctx.lineWidth = 5;
  ctx.beginPath();
  if(type==='thrust'){
    ctx.moveTo(-110, 8); ctx.lineTo(-30, 8);
  }else{
    const sweepLow = type==='sweep' ? 40 : 0;
    ctx.arc(0, sweepLow, 85, Math.PI*0.65, Math.PI*1.35);
  }
  ctx.stroke();
  ctx.restore();
}

function drawScene(){
  // sky
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#0a0d16'); g.addColorStop(0.7, '#1c1218'); g.addColorStop(1, '#241318');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // stars (deterministic)
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for(let i=0;i<40;i++){
    const sx = (i*173+47)%W, sy = (i*97+31)%240;
    ctx.globalAlpha = 0.2 + 0.3*Math.abs(Math.sin(i*1.7 + T/1400));
    ctx.fillRect(sx, sy, 1.6, 1.6);
  }
  ctx.globalAlpha = 1;
  // red moon
  ctx.save();
  ctx.shadowColor = '#c4453f'; ctx.shadowBlur = 60;
  ctx.fillStyle = '#b8423c';
  ctx.beginPath(); ctx.arc(790, 110, 52, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.arc(775, 100, 14, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(805, 128, 9, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  // bamboo silhouettes
  ctx.strokeStyle = '#16201a'; ctx.lineWidth = 9;
  for(const bx of [60, 110, 870, 915, 935]){
    const sway = Math.sin(T/2000 + bx)*4;
    line0(bx, GY, bx+sway, 60);
    ctx.lineWidth = 2; ctx.strokeStyle = '#1d2b22';
    for(let yy=120; yy<GY; yy+=70) line0(bx-6, yy, bx+8, yy-4);
    ctx.lineWidth = 9; ctx.strokeStyle = '#16201a';
  }
  // ground
  ctx.fillStyle = '#15110e'; ctx.fillRect(0, GY, W, H-GY);
  ctx.strokeStyle = '#3a2f24'; ctx.lineWidth = 2; line0(0, GY, W, GY);
  ctx.fillStyle = 'rgba(190,160,140,.04)'; ctx.fillRect(0, GY-30, W, 30); // mist
  // petals
  ctx.fillStyle = '#94424a';
  for(const p of petals){
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.w);
    ctx.globalAlpha = 0.65;
    ctx.fillRect(-p.r, -p.r/2, p.r*2, p.r);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawPerilSign(){
  const e = enemy;
  if(e.state!=='windup' || !e.atk || !PERILOUS[e.atk.type]) return;
  const p = clamp(e.t/e.atk.windup, 0, 1);
  const pulse = 1 + 0.15*Math.sin(T/60);
  ctx.save();
  ctx.translate(EX, GY-185);
  ctx.scale(pulse, pulse);
  ctx.shadowColor = '#ff2116'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#ff3525';
  ctx.font = 'bold 44px "Yu Mincho", "Batang", serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('危', 0, 0);
  ctx.restore();
  // hint text
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#ffb3a8';
  ctx.font = '13px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(e.atk.type==='thrust' ? '찌르기 — [↓] 미키리' : '휩쓸기 — [↑] 점프', EX, GY-225);
  ctx.restore();
  void p;
}

function drawDeathblowPrompt(){
  if(enemy.state!=='broken') return;
  const left = (enemy.brokenUntil-T)/2600;
  const pulse = 1 + 0.12*Math.sin(T/70);
  ctx.save();
  ctx.translate(EX, GY-95);
  ctx.scale(pulse, pulse);
  ctx.shadowColor = '#ff2516'; ctx.shadowBlur = 26;
  ctx.fillStyle = '#e8281a';
  ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px "Yu Mincho", serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('忍', 0, 1);
  ctx.restore();
  ctx.save();
  ctx.fillStyle = '#ffd9d4';
  ctx.font = 'bold 16px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('[SPACE] 인살', EX, GY-150);
  // time ring
  ctx.strokeStyle = '#ff5a48'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(EX, GY-95, 32, -Math.PI/2, -Math.PI/2 + Math.PI*2*left); ctx.stroke();
  ctx.restore();
}

function drawBars(){
  // ----- enemy posture (top center, fills outward from middle like Sekiro)
  const bw = 420, bx = W/2-bw/2, by = 28;
  ctx.fillStyle = 'rgba(10,8,8,.7)'; ctx.fillRect(bx, by, bw, 15);
  ctx.strokeStyle = '#6b5238'; ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, bw, 15);
  const half = (enemy.post/enemy.postMax)*bw/2;
  const ratio = enemy.post/enemy.postMax;
  ctx.fillStyle = ratio>0.85 ? '#ff5a30' : '#e8a33c';
  ctx.fillRect(W/2-half, by+2, half*2, 11);
  ctx.fillStyle = '#caa86b'; ctx.fillRect(W/2-1, by, 2, 15);
  ctx.fillStyle = '#d8c8a8';
  ctx.font = '12px "Malgun Gothic", sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('적 체간', W/2, by-6);
  // remaining deathblow markers
  for(let i=0;i<PHASES.length;i++){
    const filled = i >= phase;
    ctx.beginPath();
    ctx.arc(bx-24-i*20, by+8, 6, 0, Math.PI*2);
    ctx.fillStyle = filled ? '#e8281a' : 'rgba(80,60,60,.5)';
    ctx.fill();
    ctx.strokeStyle = '#caa86b'; ctx.lineWidth = 1; ctx.stroke();
  }
  // phase name
  ctx.fillStyle = '#8a93a3'; ctx.font = '13px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(PHASES[Math.min(phase, PHASES.length-1)].name, 18, 30);

  // ----- player HP (bottom left)
  const hw = 260, hx = 24, hy = H-44;
  ctx.fillStyle = 'rgba(10,8,8,.7)'; ctx.fillRect(hx, hy, hw, 14);
  ctx.strokeStyle = '#5a4a3a'; ctx.strokeRect(hx, hy, hw, 14);
  ctx.fillStyle = player.hp>30 ? '#b8302a' : '#ff3525';
  ctx.fillRect(hx+2, hy+2, (hw-4)*player.hp/100, 10);
  ctx.fillStyle = '#d8c8a8'; ctx.font = '12px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('생명', hx, hy-5);

  // ----- player posture (bottom center)
  const pw = 300, px = W/2-pw/2, py = H-38;
  ctx.fillStyle = 'rgba(10,8,8,.7)'; ctx.fillRect(px, py, pw, 10);
  ctx.strokeStyle = '#5a4a3a'; ctx.strokeRect(px, py, pw, 10);
  const phalf = (player.post/100)*pw/2;
  ctx.fillStyle = player.post>80 ? '#ff7a30' : '#caa040';
  ctx.fillRect(W/2-phalf, py+2, phalf*2, 6);
  ctx.fillStyle = '#a89878'; ctx.font = '11px "Malgun Gothic", sans-serif';
  ctx.textAlign = 'center'; ctx.fillText('내 체간', W/2, py-4);

  // streak
  if(stats.streak>=2){
    ctx.fillStyle = '#ffd277';
    ctx.font = 'bold 16px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('연속 튕기기 ×'+stats.streak, W-24, H-30);
  }
}

function drawFloats(){
  for(const f of floats){
    const p = (T-f.t0)/f.life;
    ctx.save();
    ctx.globalAlpha = 1-p;
    ctx.fillStyle = f.color;
    ctx.font = 'bold '+f.size+'px "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.txt, f.x, f.y - p*36);
    ctx.restore();
  }
}
function drawSparks(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const s of sparks){
    ctx.globalAlpha = 1-s.t/s.life;
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x-s.size/2, s.y-s.size/2, s.size, s.size);
  }
  ctx.restore();
}

function drawOverlays(){
  if(interMsg && T<interMsg.until && state==='fight'){
    const p = (interMsg.until-T)/1800;
    ctx.save();
    ctx.globalAlpha = clamp(p*2.5, 0, 1);
    ctx.fillStyle = '#e8d8b8';
    ctx.font = 'bold 46px "Yu Mincho", "Batang", serif';
    ctx.textAlign = 'center';
    ctx.fillText(interMsg.txt, W/2, H/2-30);
    ctx.font = '18px "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#a89878';
    ctx.fillText(interMsg.sub, W/2, H/2+8);
    ctx.restore();
  }
  if(state==='title'){
    ctx.fillStyle = 'rgba(5,5,8,.72)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8d8b8';
    ctx.font = 'bold 58px "Yu Mincho", "Batang", serif';
    ctx.fillText('劍 戟', W/2, 150);
    ctx.font = 'bold 24px "Malgun Gothic", sans-serif';
    ctx.fillText('— 패링의 길 —', W/2, 192);
    ctx.font = '17px "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#c8b898';
    const lines = [
      '[SPACE]  패링 — 베기 공격을 타이밍에 맞춰 튕겨낸다',
      '[↓ / S]  미키리 — 붉은 危 찌르기를 밟아 반격한다',
      '[↑ / W]  점프 — 붉은 危 휩쓸기를 뛰어넘는다',
      '',
      '완벽한 패링으로 적의 체간을 무너뜨리고 인살하라.',
      '세 번 인살하면 승리. 막기만 하면 내 체간이 무너진다.',
    ];
    lines.forEach((l,i)=>ctx.fillText(l, W/2, 258+i*30));
    ctx.fillStyle = '#ffd277';
    ctx.font = 'bold 20px "Malgun Gothic", sans-serif';
    if(Math.sin(T/300)>-0.3) ctx.fillText('SPACE 를 눌러 시작', W/2, 480);
  }
  if(state==='defeat'){
    const p = clamp((T-stateT)/800, 0, 1);
    ctx.fillStyle = 'rgba(8,3,3,'+(0.75*p)+')'; ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.globalAlpha = p;
    ctx.textAlign = 'center';
    ctx.shadowColor = '#a01010'; ctx.shadowBlur = 40;
    ctx.fillStyle = '#c01818';
    ctx.font = 'bold 150px "Yu Mincho", "Batang", serif';
    ctx.fillText('死', W/2, H/2+40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#a89878';
    ctx.font = '17px "Malgun Gothic", sans-serif';
    ctx.fillText('[R] 다시 도전', W/2, H/2+110);
    ctx.restore();
  }
  if(state==='victory'){
    const p = clamp((T-stateT)/800, 0, 1);
    ctx.fillStyle = 'rgba(6,6,10,'+(0.7*p)+')'; ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.globalAlpha = p;
    ctx.textAlign = 'center';
    ctx.shadowColor = '#d8b860'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#e8d8a8';
    ctx.font = 'bold 90px "Yu Mincho", "Batang", serif';
    ctx.fillText('勝 利', W/2, 180);
    ctx.shadowBlur = 0;
    ctx.font = '18px "Malgun Gothic", sans-serif';
    ctx.fillStyle = '#c8b898';
    const dur = Math.round((T-stats.start)/1000);
    const rows = [
      '완벽한 패링  '+stats.perfects+'회      미키리  '+stats.mikiris+'회',
      '막기  '+stats.blocks+'회      피격  '+stats.hitsTaken+'회',
      '최대 연속 튕기기  ×'+stats.maxStreak,
      '소요 시간  '+Math.floor(dur/60)+'분 '+(dur%60)+'초',
    ];
    rows.forEach((r,i)=>ctx.fillText(r, W/2, 250+i*34));
    ctx.fillStyle = '#ffd277';
    ctx.fillText('[R] 한 번 더', W/2, 420);
    ctx.restore();
  }
}

function render(){
  ctx.save();
  if(shake>0.3) ctx.translate(rand(-shake,shake), rand(-shake,shake));
  drawScene();
  drawStrikeTrail();
  drawFighter(PX, 1, playerPose());
  drawFighter(EX, -1, enemyPose());
  drawPerilSign();
  drawDeathblowPrompt();
  drawSparks();
  if(state!=='title'){ drawBars(); drawFloats(); }
  ctx.restore();
  if(flash.a>0){
    ctx.fillStyle = flash.color;
    ctx.globalAlpha = flash.a;
    ctx.fillRect(0,0,W,H);
    ctx.globalAlpha = 1;
  }
  drawOverlays();
}

// ---------------------------------------------------------------- main loop
function frame(nowReal){
  requestAnimationFrame(frame);
  const dtReal = Math.min(50, nowReal-realPrev);
  realPrev = nowReal;
  if(nowReal>slowUntilReal) timeScale += (1-timeScale)*0.15;
  const dt = dtReal*timeScale;
  T += dt;
  update(dt);
  render();
}
// init placeholder objects so render works on title screen
player = {hp:100, post:0, stunUntil:-1e9, parryT:-1e9, mikiriT:-1e9, jumpT:-1e9, hitT:-1e9};
enemy  = {post:0, postMax:100, state:'cooldown', t:1e9, atk:null, combo:null, idx:0,
          lastGain:-1e9, brokenUntil:0, glintPlayed:false, hitReact:-1e9};
stats  = {perfects:0, blocks:0, hitsTaken:0, mikiris:0, streak:0, maxStreak:0, start:0};
phase = 0;
// debug hook for automated testing
window.__game = { snap: ()=>({state, T:Math.round(T), hp:player.hp, ppost:Math.round(player.post),
                              epost:Math.round(enemy.post), estate:enemy.state, phase,
                              stats:JSON.parse(JSON.stringify(stats))}) };
requestAnimationFrame(frame);
</script>
</body>
